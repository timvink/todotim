name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Runs repository code (tests, build) with read-only access. Its only output is a workflow artifact.
  build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Check tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3, got '$GITHUB_REF_NAME'"
            exit 1
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Build universal app
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh
      - name: Package
        run: |
          mkdir dist
          ditto -c -k --keepParent build/TodoTim.app "dist/TodoTim-${GITHUB_REF_NAME}.zip"
          cd dist
          shasum -a 256 "TodoTim-${GITHUB_REF_NAME}.zip" > "TodoTim-${GITHUB_REF_NAME}.zip.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Publishes the built files. Does not check out or run repository code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Verify checksum
        working-directory: dist
        run: sha256sum -c "TodoTim-${GITHUB_REF_NAME}.zip.sha256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/TodoTim-${{ github.ref_name }}.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/TodoTim-${GITHUB_REF_NAME}.zip" \
            "dist/TodoTim-${GITHUB_REF_NAME}.zip.sha256" \
            --title "TodoTim ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
