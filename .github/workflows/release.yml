name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Build universal app
        env:
          VERSION: ${{ github.ref_name }}
        run: UNIVERSAL=1 VERSION="${VERSION#v}" scripts/bundle.sh
      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent TodoTim.app "TodoTim-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "TodoTim-${GITHUB_REF_NAME}.zip" > "TodoTim-${GITHUB_REF_NAME}.zip.sha256"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/TodoTim-${GITHUB_REF_NAME}.zip" \
            "build/TodoTim-${GITHUB_REF_NAME}.zip.sha256" \
            --title "TodoTim ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
