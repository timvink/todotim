name: Release

# One release stream per app, each with its own version:
#   macos-v1.2.3    TodoTim-macOS-1.2.3.zip
#   android-v1.2.3  TodoTim-Android-1.2.3.apk
#   linux-v1.2.3    todotim-omarchy-1.2.3-x86_64.tar.gz and -aarch64.tar.gz (the Omarchy plugin)
# (Releases up to v0.9.1 had the Mac and Android apps together under one vX.Y.Z tag.)
on:
  push:
    tags: ["macos-v*", "android-v*", "linux-v*"]

permissions: {}

jobs:
  # Reads the app and version from the tag.
  tag:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      platform: ${{ steps.parse.outputs.platform }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Check tag
        id: parse
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^(macos|android|linux)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tags look like macos-v1.2.3, android-v1.2.3 or linux-v1.2.3, got '$GITHUB_REF_NAME'"
            exit 1
          fi
          echo "platform=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

  # Each build job runs repository code (tests, build) with read-only access. Its only output is a
  # workflow artifact.
  build-macos:
    needs: tag
    if: needs.tag.outputs.platform == 'macos'
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Developer ID signing and notarization run only when all five secrets exist (docs/signing.md);
      # otherwise the app is ad-hoc signed. Each secret is passed only to the step that uses it.
      - name: Check signing secrets
        id: signing
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set=0
          for name in MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -n "${!name}" ]]; then set=$((set + 1)); fi
          done
          if [[ "$set" == 5 ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing with Developer ID and notarizing."
          elif [[ "$set" == 0 ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets: building an ad-hoc signed app."
          else
            echo "::error::Only $set of the 5 signing secrets are set; set all of them or none (docs/signing.md)"
            exit 1
          fi
      - name: Test
        run: swift test
      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          (umask 077 && printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12")
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without a UI prompt, and put the keychain in the search list.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F '"' '/"Developer ID Application: / { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo "::error::No valid 'Developer ID Application' identity in MACOS_CERT_P12_BASE64"
            exit 1
          fi
          echo "Signing identity: $identity"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build universal app
        run: UNIVERSAL=1 scripts/bundle.sh
      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/notary_key.p8"
          (umask 077 && printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$key")
          ditto -c -k --keepParent build/TodoTim.app "$RUNNER_TEMP/notarize.zip"
          # notarytool can exit 0 for a rejected upload, so check the status it reports.
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          cat "$RUNNER_TEMP/notary.json"
          if [[ "$(jq -r .status "$RUNNER_TEMP/notary.json")" != "Accepted" ]]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" \
              --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            rm -f "$key"
            echo "::error::Notarization failed"
            exit 1
          fi
          rm -f "$key" "$RUNNER_TEMP/notarize.zip"
          xcrun stapler staple build/TodoTim.app
      - name: Package
        run: |
          mkdir dist
          ditto -c -k --keepParent build/TodoTim.app "dist/TodoTim-macOS-${VERSION}.zip"
          cd dist
          shasum -a 256 "TodoTim-macOS-${VERSION}.zip" > "TodoTim-macOS-${VERSION}.zip.sha256"
      - name: Check Gatekeeper
        if: steps.signing.outputs.enabled == 'true'
        run: |
          check="$RUNNER_TEMP/gatekeeper"
          mkdir "$check"
          ditto -x -k "dist/TodoTim-macOS-${VERSION}.zip" "$check"
          xcrun stapler validate "$check/TodoTim.app"
          spctl -a -vv -t exec "$check/TodoTim.app"
      - name: Delete signing keychain
        if: always() && steps.signing.outputs.enabled == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary_key.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Builds the signed APK. Without the signing secrets there is nothing to release (docs/signing.md).
  build-android:
    needs: tag
    if: needs.tag.outputs.platform == 'android'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::An Android release needs the signing secrets (docs/signing.md)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          (umask 077
           printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
           printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=todotim\nkeyPassword=%s\n' \
             "$RUNNER_TEMP/release.keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > keystore.properties)
          ./gradlew --no-daemon -PtodotimVersion="$VERSION" :core:test :app:testDebugUnitTest :app:assembleRelease
          rm -f keystore.properties "$RUNNER_TEMP/release.keystore"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/TodoTim-Android-${VERSION}.apk"
          cd ../dist && sha256sum "TodoTim-Android-${VERSION}.apk" > "TodoTim-Android-${VERSION}.apk.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Builds the Omarchy plugin: the tests on Linux, a fully static engine per architecture
  # (cross-compiled with Swift's Static Linux SDK), and one tarball per architecture.
  build-linux:
    needs: tag
    if: needs.tag.outputs.platform == 'linux'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: scripts/linux-test.sh
      - name: Build static engines
        run: scripts/linux-build.sh
      - name: Check the engine
        run: |
          [[ "$(build/linux/x86_64/todotim-engine --version)" == "$VERSION" ]]
          file build/linux/*/todotim-engine | tee /dev/stderr | grep -c 'statically linked' | grep -qx 2
          printf '%s\n' '{"req":1,"cmd":"hello"}' | build/linux/x86_64/todotim-engine --data-dir "$RUNNER_TEMP/data" --no-sync | grep -q '"re":1,"result"'
      - name: Package
        run: scripts/linux-package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Publishes the built files. Does not check out or run repository code.
  publish:
    needs: [tag, build-macos, build-android, build-linux]
    # The two build jobs of the other apps are skipped; publish when the one that ran succeeded.
    if: >-
      always() && needs.tag.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release*
          merge-multiple: true
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256
      - name: List release files
        id: files
        run: |
          { echo 'paths<<EOF'; find dist -type f ! -name '*.sha256' | sort; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.paths }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLATFORM: ${{ needs.tag.outputs.platform }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          case "$PLATFORM" in
            macos) name="macOS" ;;
            android) name="Android" ;;
            linux) name="Omarchy" ;;
          esac
          # Notes since this app's previous release (for the first one, since the last joint vX.Y.Z release).
          tags="$(gh release list --limit 200 --json tagName --jq '.[].tagName')"
          previous="$(grep -E "^${PLATFORM}-v" <<< "$tags" | head -n1 || true)"
          [[ -n "$previous" || "$PLATFORM" == linux ]] || previous="$(grep -E '^v[0-9]' <<< "$tags" | head -n1 || true)"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "TodoTim for $name $VERSION" \
            --generate-notes ${previous:+--notes-start-tag "$previous"} \
            --verify-tag
